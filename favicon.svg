<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 0.9;
        filter: drop-shadow(0 0 3px #38BDF8);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 7px #818CF8);
      }
    }
    .orbit-ring {
      transform-origin: 50px 50px;
      animation: spin 5s linear infinite;
    }
    .logo-core {
      animation: pulse-glow 2.8s ease-in-out infinite;
    }
  </style>

  <!-- Base Squircle Background -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="88" height="88" rx="24" fill="none" stroke="url(#strokeGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Animated Rotating Orbit Ring -->
  <circle class="orbit-ring" cx="50" cy="50" r="40" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="140 60" stroke-linecap="round" />
  <circle class="orbit-ring" cx="50" cy="50" r="40" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-dasharray="2 198" stroke-linecap="round" />

  <!-- Monogram NK (Nguyen Quoc Khai) -->
  <g class="logo-core" filter="url(#glow)">
    <!-- N left vertical stem -->
    <line x1="30" y1="28" x2="30" y2="72" stroke="url(#strokeGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- N diagonal slash -->
    <line x1="30" y1="28" x2="50" y2="72" stroke="url(#strokeGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Shared stem (N right / K vertical spine) -->
    <line x1="50" y1="28" x2="50" y2="72" stroke="url(#strokeGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- K upper dynamic arm -->
    <line x1="50" y1="50" x2="70" y2="28" stroke="url(#strokeGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- K lower dynamic arm -->
    <line x1="50" y1="50" x2="70" y2="72" stroke="url(#strokeGrad)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Tech Circuit Nodes -->
    <circle cx="30" cy="28" r="2.8" fill="#38BDF8" />
    <circle cx="50" cy="28" r="2.8" fill="#818CF8" />
    <circle cx="70" cy="28" r="2.8" fill="#A855F7" />
    <circle cx="70" cy="72" r="2.8" fill="#38BDF8" />
  </g>
</svg>
